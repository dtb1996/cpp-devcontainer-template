name: Multi-OS C++ CMake CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  changes:
    name: Check for C++ changes
    runs-on: ubuntu-latest

    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cpp:
              - "CMakeLists.txt"
              - "include/**"
              - "src/**"
              - "tests/**"
              - "cmake/**"
              - ".github/workflows/**"

  build-and-test:
    name: ${{ matrix.os }} Build
    needs: changes

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Skip build
        if: needs.changes.outputs.cpp != 'true'
        run: echo "No C++ project changes detected. Skipping build and test."

      - name: Checkout repository
        if: needs.changes.outputs.cpp == 'true'
        uses: actions/checkout@v5

      - name: Install Build Dependencies (Linux)
        if: needs.changes.outputs.cpp == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install Build Dependencies (macOS)
        if: needs.changes.outputs.cpp == 'true' && matrix.os == 'macos-latest'
        run: brew install ninja

      - name: Configure CMake
        if: needs.changes.outputs.cpp == 'true'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build Project
        if: needs.changes.outputs.cpp == 'true'
        run: cmake --build build --config Release

      - name: Run Tests
        if: needs.changes.outputs.cpp == 'true'
        working-directory: build
        run: ctest --output-on-failure -C Release
